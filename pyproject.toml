[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Discover highlight moments, render vertical Shorts, and optionally upload them to YouTube."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nayan Kunwar" }]
keywords = ["shorts", "ffmpeg", "youtube", "clips", "highlights"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "yt-dlp>=2024.8.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0.0"]
upload = [
  "google-api-python-client>=2.0.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
]
web = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "email-validator>=2.2.0",
  "jinja2>=3.1.0",
  "tzdata>=2024.1",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
]
all = [
  "faster-whisper>=1.0.0",
  "google-api-python-client>=2.0.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "email-validator>=2.2.0",
  "jinja2>=3.1.0",
  "tzdata>=2024.1",
]

[project.scripts]
clipforge = "clipforge.cli:main"
clipforge-worker = "clipforge.worker:main"

[project.urls]
Repository = "https://github.com/nayan-kunwar/clipforge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that invoke ffmpeg or other external binaries",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
